name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: mkv420/sam-ltx23-comfyui

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # -----------------------------------------------------------------
          # Build matrix:
          #   - :cuda13-v2   CUDA 13 release tag
          #   - :h3-cu130-v2 MiniMax H3 release tag
          #   - :latest      Floating latest tag
          #   - :<sha>       Immutable per-commit tag
          # -----------------------------------------------------------------
          tags: |
            ${{ env.IMAGE }}:cuda13-v2
            ${{ env.IMAGE }}:h3-cu130-v2
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # TORCH_CUDA_ARCH_LIST MUST be ';' separated.
          # Supports RTX 3090 (8.6), RTX 4090 (8.9), and RTX 5090 (12.0).
          build-args: |
            TORCH_CUDA_ARCH_LIST=8.6;8.9;12.0
            MAX_JOBS=2
            EXT_PARALLEL=2
            NVCC_THREADS=2
            SAGE_REF=d1a57a546c3d395b1ffcbeecc66d81db76f3b4b5
            COMFYUI_MIN_VERSION=0.33.0
            COMFYUI_REF=v0.33.1
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Disk after
        if: always()
        run: df -h /
