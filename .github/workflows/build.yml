name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sam-ltx23-comfyui

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Disk before
        run: df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:cuda13-v2
            ${{ env.IMAGE }}:h3-cu130-v2
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # TORCH_CUDA_ARCH_LIST MUST be ';' separated.
          # Supports RTX 3090 (8.6), RTX 4090 (8.9), and RTX 5090 (12.0).
          build-args: |
            TORCH_CUDA_ARCH_LIST=8.6;8.9;12.0
            MAX_JOBS=2
            EXT_PARALLEL=2
            NVCC_THREADS=2
            SAGE_REF=d1a57a546c3d395b1ffcbeecc66d81db76f3b4b5
            COMFYUI_MIN_VERSION=0.33.0
            COMFYUI_REF=v0.33.1
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Disk after
        if: always()
        run: df -h /
